services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cstv}
      POSTGRES_USER: ${DB_USER:-cstv}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cstv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cstv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      USE_SQLITE: "False"
      USE_X_ACCEL_REDIRECT: "True"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LIVE_RECORDINGS_ROOT: /recordings
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - live_recordings_volume:/recordings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  celery_worker:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      USE_SQLITE: "False"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LIVE_RECORDINGS_ROOT: /recordings
    volumes:
      - media_volume:/app/media
      - live_recordings_volume:/recordings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info

  celery_beat:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      USE_SQLITE: "False"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
    restart: unless-stopped
    environment:
      # Utilisé côté serveur (server components) pour joindre Django via le réseau interne Docker ;
      # le navigateur, lui, continue de passer par NEXT_PUBLIC_API_URL (nginx, port 80 public).
      INTERNAL_API_URL: http://web:8000
    depends_on:
      - web

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    environment:
      RTMP_WEBHOOK_SECRET: ${RTMP_WEBHOOK_SECRET}
    volumes:
      - ./docker/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - live_recordings_volume:/recordings
    ports:
      # RTMP : c'est le port auquel OBS/Wirecast se connectent (cf RTMP_INGEST_BASE_URL dans .env).
      - "1935:1935"
    depends_on:
      - web

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
      - frontend
      - mediamtx

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  live_recordings_volume:
