upstream cstv_web {
    server web:8000;
}

upstream cstv_frontend {
    server frontend:3000;
}

upstream cstv_mediamtx_hls {
    server mediamtx:8888;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 4G;

    location /static/ {
        alias /app/staticfiles/;
    }

    # Fichiers media publics : servis directement, sans passer par Django (avatars, images
    # communautaires, miniatures vidéo — rien de sensible ni de payant).
    location /media/avatars/ {
        alias /app/media/avatars/;
    }
    location /media/community/posts/ {
        alias /app/media/community/posts/;
    }
    location /media/videos/thumbnails/ {
        alias /app/media/videos/thumbnails/;
    }

    # Fichiers media protégés (vidéos sources/HLS) : jamais servis statiquement, toujours
    # délégués à Django qui vérifie un token signé avant de renvoyer un X-Accel-Redirect vers
    # la location interne ci-dessous.
    location /media/hls/ {
        proxy_pass http://cstv_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cible interne utilisée par X-Accel-Redirect : jamais atteignable directement de l'extérieur.
    location /internal-media/ {
        internal;
        alias /app/media/;
    }

    # Tout le reste de /media/ (ex : vidéos sources brutes) n'a aucune route publique prévue.
    location /media/ {
        return 404;
    }

    # Lecture des lives en direct (HLS généré par MediaMTX). Contrairement aux rediffusions VOD,
    # ce flux n'est pas protégé par token : il est transitoire et cesse d'exister à la fin du live.
    location /hls/ {
        proxy_pass http://cstv_mediamtx_hls/;
        add_header Cache-Control no-cache;
    }

    location /ws/ {
        proxy_pass http://cstv_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # API REST, admin Django, doc Swagger, sitemap : tout ce qui reste servi par Django, même si
    # "/" pointe désormais vers le frontend Next.js.
    location /api/ {
        proxy_pass http://cstv_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://cstv_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://cstv_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://cstv_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Page d'accueil et tout le reste de l'UI : Next.js.
    location / {
        proxy_pass http://cstv_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
